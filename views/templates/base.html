<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Resultados de intermediarios{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header class="encabezado">
    <p class="marca">Planeacion · Seguimiento de la estrategia</p>
    <h1>Resultados de intermediarios de seguros</h1>
  </header>

  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    <p>Proceso trimestral de estados financieros · Costa Rica</p>
  </footer>
</body>
</html>
